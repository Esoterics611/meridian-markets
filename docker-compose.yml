version: '3.9'

# Postgres for Meridian Markets — port 5433 (Lira-Bridge owns 5432).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meridian_markets
      POSTGRES_PASSWORD: meridian_markets
      POSTGRES_DB: meridian_markets
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meridian_markets']
      interval: 5s
      timeout: 5s
      retries: 10

  # The desk bus (TECHNOLOGY_OVERVIEW §3.2) — NATS core only, no JetStream:
  # durability lives in tapes/Postgres, the broker just moves messages.
  nats:
    image: nats:2-alpine
    ports:
      - '4222:4222'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8222/healthz || exit 0']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
